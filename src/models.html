<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modellink - Manage Models</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/models.css" />
  </head>
  <body>
    <!-- Create Models Section -->
    <section class="create-model-section">
      <h2 class="section-title">Add New Model</h2>
      <form id="modelForm" class="model-form">
        <div class="input-wrapper">
          <label for="modelName" class="input-label">Model Name*</label>
          <input type="text" id="modelName" placeholder="Model Name" required />
        </div>
        <div class="input-wrapper">
          <label for="modelCategory" class="input-label">Category*</label>
          <input
            type="text"
            id="modelCategory"
            placeholder="Category (Runway, Editorial)"
            required
          />
        </div>
        <div class="input-wrapper">
          <label for="modelImage" class="input-label">Image*</label>
          <input type="url" id="modelImage" placeholder="Image URL" required />
        </div>
        <div class="input-wrapper">
          <label for="modelBio" class="input-label">Bio*</label>
          <textarea id="modelBio" placeholder="Short Bio" required></textarea>
        </div>
        <button type="submit">Create Model</button>
      </form>
    </section>
    <script src="./js/models.js"></script>
  </body>
</html>
